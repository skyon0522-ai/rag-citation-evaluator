name: Portable RAG fixtures

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.3'
      - name: Install pinned Rust and report versions
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustc --version
          cargo --version
          python3 --version
      - name: Build locked CLI and check fixed synthetic fixtures
        run: sh ./verify-portable.sh "$RUNNER_TEMP/rag-fixture-results"
      - name: Retain synthetic fixture receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rag-fixture-results
          path: ${{ runner.temp }}/rag-fixture-results/fixture-results.json
          if-no-files-found: warn
          retention-days: 7
